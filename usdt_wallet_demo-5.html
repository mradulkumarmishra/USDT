<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDT Wallet — Demo</title>
<style>
:root{
  --cream:#f7f4ea; --card:#fffdf8; --ink:#171612; --muted:#8c887e;
  --gold:#c79b22; --gold2:#e7d39a; --dark:#302b20; --line:#e7e2d8;
  --green:#4d7e69; --red:#b34d4d;
}
*{box-sizing:border-box}
body{margin:0;background:#eeeae0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button,input{font:inherit}
.app{width:min(100%,520px);min-height:100vh;margin:auto;background:var(--cream);position:relative;padding-bottom:82px}
header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid rgba(0,0,0,.04);position:sticky;top:0;background:rgba(247,244,234,.96);backdrop-filter:blur(10px);z-index:5}
.iconbtn{width:46px;height:46px;border:1px solid var(--line);background:#fffdf8;border-radius:14px;display:grid;place-items:center;font-size:24px;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:20px}
.logo{width:42px;height:42px;border:1px solid #d2b75e;border-radius:12px;display:grid;place-items:center;font-family:Georgia;font-size:24px;color:#a77d10;background:#fffdf7}
.avatar{width:44px;height:44px;border-radius:50%;background:#272218;color:#d6b64c;display:grid;place-items:center;font-weight:700}
main{padding:28px 20px}
.eyebrow{font-size:13px;letter-spacing:2px;font-weight:750;color:#ae861a;margin-bottom:10px}
h1{font-size:43px;line-height:1.03;margin:0 0 28px;letter-spacing:-1.8px}
h2{font-size:25px;margin:0 0 18px}
.balance{background:var(--dark);color:white;border-radius:30px;padding:28px 30px;box-shadow:0 18px 35px #27221818;position:relative;overflow:hidden}
.balance:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #b79b4b33;border-radius:50%;right:-70px;top:-80px}
.balance .label{color:#bdb7aa;font-size:16px}
.live{float:right;color:#b5dc7b;font-size:13px;letter-spacing:1px}
.amount{font-size:64px;font-weight:300;margin:48px 0 35px;letter-spacing:-3px}
.value{color:#c7c0b2;font-size:16px}
.rate{float:right;background:#4a412b;color:#e1c55f;padding:9px 13px;border-radius:10px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:38px 0 15px}
.muted{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.action{min-height:205px;border:1px solid var(--line);border-radius:28px;padding:22px;cursor:pointer;text-align:left}
.action.dark{background:var(--dark);color:white}
.action.light{background:#eee6d0}
.action .bigicon{font-size:28px;margin-bottom:52px}
.action strong{display:block;font-size:20px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;margin-bottom:18px}
.activity{display:flex;align-items:center;gap:15px}
.activity-icon{width:54px;height:54px;border-radius:16px;background:#f2dddd;display:grid;place-items:center;color:#a84444}
.activity .grow{flex:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:82px;background:#fffdf9;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
.nav button{border:0;background:none;color:#77736b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:12px}
.nav button.active{color:#ae861a;font-weight:700}
.nav .ni{font-size:23px}
.form-card{padding:28px;border-radius:26px;background:#fffdf9;border:1px solid var(--line)}
.networks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.network{padding:18px;border:1px solid var(--line);border-radius:18px;background:white;text-align:left;cursor:pointer}
.network.selected{border:2px solid #d5b85f;background:#fcf8e9}
.network b{display:block;margin-bottom:5px}
label{display:block;font-weight:700;margin:18px 0 9px}
input{width:100%;padding:18px;border:1px solid var(--line);border-radius:16px;background:#f8f6f0;outline:none}
input:focus{border-color:#c79b22}
.amountbox{font-size:30px}
.quick{display:flex;gap:9px;margin-top:10px}
.quick button{flex:1;padding:12px;border:1px solid var(--line);background:white;border-radius:12px;cursor:pointer}
.summary{margin-top:22px;background:#fffdf9;border:1px solid var(--line);border-radius:24px;padding:24px}
.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.primary{width:100%;border:0;background:#c79b22;color:#171612;padding:18px;border-radius:16px;font-weight:800;cursor:pointer;margin-top:20px}
.primary:disabled{background:#aaa8a1;color:white;cursor:not-allowed}
.menu{position:fixed;inset:0;background:#0004;z-index:20;display:none}
.menu.open{display:block}
.drawer{width:min(90%,420px);height:100%;background:var(--cream);padding:28px 22px;box-shadow:8px 0 30px #0002}
.drawer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.menuitem{padding:18px 10px;border-bottom:1px solid var(--line);font-size:18px;cursor:pointer}
.qr{height:180px;width:180px;margin:15px auto;border:12px solid white;border-radius:12px;background:
repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/18px 18px;
display:grid;place-items:center}
.qr span{background:white;border:5px solid white;border-radius:6px;font-size:25px}
.notice{font-size:13px;color:#777;margin-top:12px;line-height:1.5}
.hidden{display:none!important}
@media(max-width:390px){h1{font-size:37px}.amount{font-size:52px}.actions{gap:10px}.action{padding:18px}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="iconbtn" onclick="toggleMenu()">☰</button>
  <div class="brand"><div class="logo">W</div><span>USDT Wallet</span></div>
  <div class="avatar">P</div>
</header>

<main id="content"></main>

<nav class="nav">
  <button class="active" data-page="home" onclick="showPage('home')"><span class="ni">⌂</span>Home</button>
  <button data-page="orders" onclick="showPage('orders')"><span class="ni">▤</span>Orders</button>
  <button data-page="history" onclick="showPage('history')"><span class="ni">◴</span>History</button>
  <button data-page="profile" onclick="showPage('profile')"><span class="ni">♙</span>Profile</button>
</nav>

<div class="menu" id="menu" onclick="if(event.target===this)toggleMenu()">
  <div class="drawer">
    <div class="drawer-top"><h2>Menu</h2><button class="iconbtn" onclick="toggleMenu()">×</button></div>
    <div class="menuitem" onclick="showPage('home');toggleMenu()">⌂ &nbsp; Home</div>
    <div class="menuitem" onclick="showPage('orders');toggleMenu()">▤ &nbsp; Orders</div>
    <div class="menuitem" onclick="showPage('history');toggleMenu()">◴ &nbsp; History</div>
    <div class="menuitem" onclick="showPage('profile');toggleMenu()">♙ &nbsp; Profile</div>
    <div class="menuitem">♧ &nbsp; Support</div>
    <div class="menuitem">▧ &nbsp; Legal & policies</div>
    <div class="menuitem">? &nbsp; About this demo</div>
  </div>
</div>
</div>

<script>
const state={balance:3,network:'TRC20',buyAmount:15};

function money(n){return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}

function home(){
return `<div class="eyebrow">GOOD MORNING, PRINCE</div>
<h1>Overview</h1>
<div class="balance">
  <span class="label">Available balance</span><span class="live">● LIVE</span>
  <div class="amount">${state.balance.toFixed(2)} <small style="font-size:20px;letter-spacing:0">USDT</small></div>
  <span class="value">${money(state.balance*96)} estimated value</span>
  <span class="rate">1 USDT = ₹96.00</span>
</div>
<div class="section-head"><h2>Move money</h2><span class="muted">Demo only</span></div>
<div class="actions">
  <button class="action dark" onclick="showPage('buy')"><div class="bigicon">↓</div><strong>Buy USDT</strong><span>From ₹1,440</span></button>
  <button class="action light" onclick="showPage('send')"><div class="bigicon">↗</div><strong>Send USDT</strong><span>TRC20 or BEP20</span></button>
</div>
<div class="section-head"><h2>Recent activity</h2><span class="muted">View all ›</span></div>
<div class="card activity"><div class="activity-icon">↗</div><div class="grow"><b>Demo signup bonus</b><div class="muted">03 Aug 2026 · Completed</div></div><b>+3.00 USDT</b></div>
<div class="notice">This is a front-end demonstration. It does not process cryptocurrency, UPI payments, deposits, withdrawals, or real wallet transactions.</div>`;
}

function buy(){
let total=state.buyAmount*96;
return `<div class="eyebrow">SIMPLE, TRANSPARENT PRICING</div><h1>Buy USDT</h1>
<div class="form-card"><div style="display:flex;justify-content:space-between"><b>How much USDT?</b><span class="muted">Min 15 · Max 5,000</span></div>
<label>USDT amount</label><input id="buyInput" class="amountbox" type="number" min="15" max="5000" value="${state.buyAmount}" oninput="updateBuy(this.value)">
<div class="quick">${[15,50,100,250,500].map(x=>`<button onclick="updateBuy(${x})">${x}</button>`).join('')}</div></div>
<div class="summary"><div class="muted">You'll pay</div><div style="font-size:42px;font-weight:800;margin:12px 0 24px">${money(total)}</div>
<div class="row"><span>Rate</span><b>₹96.00 / USDT</b></div>
<div class="row"><span>Processing fee</span><b style="color:var(--green)">Included</b></div>
<div class="row"><span>You'll receive</span><b>${state.buyAmount.toFixed(2)} USDT</b></div>
<button class="primary" onclick="alert('Demo only: no real payment is processed.')">Continue to payment ↗</button></div>`;
}

function send(){
return `<div class="eyebrow">MOVE USDT SECURELY</div><h1>Send USDT</h1>
<div class="form-card"><div style="display:flex;justify-content:space-between"><b>Choose network</b><span class="muted">Demo network selector</span></div>
<div class="networks"><button class="network ${state.network==='TRC20'?'selected':''}" onclick="state.network='TRC20';showPage('send')"><b>⌘ TRC20</b><span class="muted">Tron network</span></button>
<button class="network ${state.network==='BEP20'?'selected':''}" onclick="state.network='BEP20';showPage('send')"><b>⌘ BEP20</b><span class="muted">BNB Smart Chain</span></button></div>
<label>Recipient wallet address</label><input id="address" placeholder="Paste demo wallet address">
<label>Amount to send</label><input id="sendAmount" class="amountbox" type="number" min="0" max="${state.balance}" placeholder="0.00">
<div class="row"><span>Available balance</span><b>${state.balance.toFixed(2)} USDT</b></div></div>
<div class="summary"><h2>Transfer summary</h2><div class="row"><span>Network</span><b>${state.network}</b></div><div class="row"><span>Amount</span><b id="sum">—</b></div><div class="row"><span>Remaining balance</span><b>${state.balance.toFixed(2)} USDT</b></div>
<button class="primary" onclick="demoSend()">Review transfer ↗</button></div>
<div class="notice">Demo mode: this form intentionally does not broadcast a blockchain transaction.</div>`;
}

function profile(){
return `<div class="eyebrow">YOUR ACCOUNT</div><h1>Profile</h1>
<div class="card"><div style="display:flex;align-items:center;gap:18px"><div class="avatar" style="width:64px;height:64px;font-size:23px">P</div><div><div style="font-size:24px">Prince</div><div class="muted">Demo account</div><div class="muted">demo@example.com</div></div></div></div>
<div class="card"><h3>🔒 Change password</h3></div>
<div class="card"><h3>♧ Support centre</h3></div>
<div class="card"><h3>▧ Legal & policies</h3></div>
<div class="card"><h3>? About this demo wallet</h3><p class="muted">Version 1.0 · Front-end prototype</p></div>
<button class="primary" style="background:#f5dede;color:#a74444" onclick="alert('Demo logout')">↪ Log out</button>`;
}

function orders(){return `<div class="eyebrow">YOUR ORDERS</div><h1>Orders</h1><div class="card"><h3>No demo orders yet</h3><p class="muted">Buy orders created in this prototype can be displayed here.</p></div>`}
function history(){return `<div class="eyebrow">ACTIVITY</div><h1>History</h1><div class="card activity"><div class="activity-icon">↗</div><div class="grow"><b>Demo signup bonus</b><div class="muted">03 Aug 2026 · Completed</div></div><b>+3.00 USDT</b></div>`}

function showPage(page){
let html=page==='home'?home():page==='buy'?buy():page==='send'?send():page==='profile'?profile():page==='orders'?orders():history();
document.getElementById('content').innerHTML=html;
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
window.scrollTo({top:0,behavior:'smooth'});
if(page==='send'){document.getElementById('sendAmount')?.addEventListener('input',e=>document.getElementById('sum').textContent=e.target.value?Number(e.target.value).toFixed(2)+' USDT':'—')}
}
function updateBuy(v){state.buyAmount=Math.max(0,Number(v)||0);showPage('buy')}
function demoSend(){
const a=Number(document.getElementById('sendAmount').value||0), addr=document.getElementById('address').value.trim();
if(!addr||a<=0||a>state.balance){alert('Enter a demo address and an amount within the available balance.');return}
alert('Demo only: review screen would appear here. No USDT is sent.');
}
function toggleMenu(){document.getElementById('menu').classList.toggle('open')}
showPage('home');
</script>
</body>
</html>
